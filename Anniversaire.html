<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Une surprise pour toi ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #ffe4ec, #fff7f9);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #4a2632;
    }

    .container {
      width: 92%;
      max-width: 420px;
      text-align: center;
    }

    /* ENVELOPPE */
    .envelope {
      position: relative;
      width: 280px;
      height: 190px;
      margin: auto;
      cursor: pointer;
      transition: transform 0.4s;
    }

    .envelope:hover {
      transform: scale(1.03);
    }

    .envelope-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 150px;
      background: #f4a6b9;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 12px 30px rgba(120, 40, 70, 0.18);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid #e889a2;
      z-index: 3;
      transform-origin: top;
      transition: transform 1s ease;
    }

    .heart {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      font-size: 42px;
      transition: 0.6s;
    }

    .open .flap {
      transform: rotateX(180deg);
    }

    .open .heart {
      opacity: 0;
    }

    .instruction {
      margin-top: 25px;
      font-size: 16px;
      color: #7b4354;
    }

    /* LETTRE */
    .letter {
      display: none;
      background: rgba(255,255,255,0.92);
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(120,40,70,0.18);
      animation: apparition 1s ease;
    }

    .letter.show {
      display: block;
    }

    .small-heart {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .message {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: messageIn 0.8s ease;
    }

    .message h2 {
      font-size: 23px;
      margin-bottom: 18px;
      color: #a43f5c;
    }

    .message p {
      font-size: 16px;
      line-height: 1.8;
    }

    .next {
      margin-top: 20px;
      border: none;
      background: #d95778;
      color: white;
      padding: 13px 22px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(180,60,90,0.25);
    }

    .next:active {
      transform: scale(0.96);
    }

    .dots {
      margin-top: 18px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #e7b6c3;
      border-radius: 50%;
      margin: 0 4px;
    }

    .dot.active {
      background: #d95778;
    }

    .final {
      font-size: 18px !important;
      font-weight: bold;
      color: #8f304d;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PETITS COEURS */
    .floating-heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp linear forwards;
      pointer-events: none;
      opacity: 0.7;
    }

    @keyframes floatUp {
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 350px) {
      .envelope {
        width: 250px;
      }

      .flap {
        border-left-width: 125px;
        border-right-width: 125px;
      }

      .letter {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ENVELOPPE -->
    <div id="envelopeSection">
      <div class="envelope" id="envelope">
        <div class="envelope-body"></div>
        <div class="flap"></div>
        <div class="heart">❤️</div>
      </div>

      <p class="instruction">
        Une petite surprise pour toi…<br>
        <strong>Ouvre-moi ❤️</strong>
      </p>
    </div>


    <!-- LETTRE -->
    <div class="letter" id="letter">

      <div class="small-heart">❤️</div>

      <div class="message" id="message"></div>

      <button class="next" id="nextButton">
        Ouvrir la suite 💌
      </button>

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </div>

  </div>


  <script>

    const envelope = document.getElementById("envelope");
    const envelopeSection = document.getElementById("envelopeSection");
    const letter = document.getElementById("letter");
    const message = document.getElementById("message");
    const nextButton = document.getElementById("nextButton");
    const dots = document.querySelectorAll(".dot");

    let currentMessage = 0;

    const messages = [

      {
        title: "Attends… 🥹❤️",
        text: `
          Je sais que tu t'attendais peut-être juste à une petite lettre…
          mais j'avais envie de te faire une petite surprise différente.
          <br><br>
          Alors prends quelques secondes et lis jusqu'au bout. ❤️
        `
      },

      {
        title: "Ce que je ne te dis pas assez… 🤍",
        text: `
          Tu comptes énormément pour moi.
          <br><br>
          J'aime nos moments, nos discussions, nos délires,
          nos petites disputes aussi 😂❤️.
          <br><br>
          Même quand je ne le montre pas toujours,
          sache que tu as une place particulière dans mon cœur.
        `
      },

      {
        title: "Joyeux anniversaire mon cœur 🎂❤️",
        text: `
          Je te souhaite la santé, le bonheur, la réussite
          et que tous tes projets se réalisent.
          <br><br>
          Et surtout, j'espère qu'on aura encore beaucoup
          de souvenirs à créer ensemble.
          <br><br>
          <span class="final">
            Je t'aime ❤️<br><br>
            Profite bien de ta journée mon cœur. 🥹🎂
          </span>
        `
      }

    ];


    function showMessage() {

      message.style.animation = "none";

      setTimeout(() => {

        message.style.animation = "messageIn 0.8s ease";

        message.innerHTML = `
          <h2>${messages[currentMessage].title}</h2>
          <p>${messages[currentMessage].text}</p>
        `;

      }, 50);

      dots.forEach((dot, index) => {
        dot.classList.toggle("active", index === currentMessage);
      });

      if (currentMessage === messages.length - 1) {
        nextButton.textContent = "Relire depuis le début ❤️";
      } else {
        nextButton.textContent = "Ouvrir la suite 💌";
      }
    }


    envelope.addEventListener("click", () => {

      envelope.classList.add("open");

      setTimeout(() => {

        envelopeSection.style.display = "none";
        letter.classList.add("show");

        showMessage();

        createHearts();

      }, 1000);

    });


    nextButton.addEventListener("click", () => {

      if (currentMessage === messages.length - 1) {

        currentMessage = 0;

      } else {

        currentMessage++;

      }

      showMessage();
      createHearts();

    });


    function createHearts() {

      for (let i = 0; i < 5; i++) {

        const heart = document.createElement("div");

        heart.className = "floating-heart";
        heart.innerHTML = ["❤️","💕","💗","💖"][Math.floor(Math.random() * 4)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 15) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 8000);

      }

    }

  </script>

</body>
</html>
